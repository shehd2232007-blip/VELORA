<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account | VELORA</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/toastr.min.css">
</head>

<body>

<header class="header">
    <h1>VELORA</h1>
    <p>Bags & Shoes</p>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
    <a href="account.html" class="active">Account</a>
</nav>

<main class="account-page">

    <section class="account-title">
        <h2>My Account</h2>
        <p>Login or create a new VELORA account.</p>
    </section>

    <section class="account">

        <form class="account-box" id="loginForm">
            <h2>Login</h2>
            <p>Welcome back to VELORA.</p>

            <label>Email Address</label>
            <input type="email" placeholder="name@example.com" required>

            <label>Password</label>
            <input type="password" placeholder="Enter your password"
                   minlength="6" required>

            <a href="#" class="forgot">Forgot Password?</a>

            <button type="submit">Login</button>
        </form>

        <form class="account-box" id="registerForm">
            <h2>Create Account</h2>
            <p>Create an account for a faster shopping experience.</p>

            <label>Full Name</label>
            <input type="text" placeholder="Your full name"
                   pattern="[A-Za-z ]{2,}" required>

            <label>Email Address</label>
            <input type="email" placeholder="name@example.com"   required>
                  
            <label>Password</label>
            <input type="password" id="password"
                   placeholder="At least 6 characters"
                   minlength="6" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Repeat your password"
                   minlength="6" required>

            <button type="submit">Create Account</button>
        </form>

    </section>

</main>

<footer class="footer">
    <p>&copy; 2026 VELORA | Bags & Shoes</p>
</footer>

<script src="js/jquery.js"></script>
<script src="js/toastr.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
