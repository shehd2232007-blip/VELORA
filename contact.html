<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | VELORA</title>

    <link rel="stylesheet" href="Font-Awesome-7.x/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>VELORA</h1>
        <p>Bags & Shoes</p>
    </header>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="account.html">Account</a>
    </nav>

    <main class="contact">

        <section class="contact-info">
            <h2>Contact Us</h2>
            <p>Have a question? We'd love to hear from you.</p>

            <p><i class="fa-solid fa-envelope"></i> hello@velora.com</p>
            <p><i class="fa-solid fa-phone"></i> +967 777 123 456</p>
            <p><i class="fa-brands fa-instagram"></i> @velora.store</p>
        </section>

<form class="contact-form">

<div class="input-box">
    <i class="fa-solid fa-user"></i>
    <input type="text" placeholder="Your Name"
           pattern="[A-Za-z ]{2,}" title="Please enter a valid name using letters only." required>
</div>

<div class="input-box">
    <i class="fa-solid fa-envelope"></i>
    <input type="email" placeholder="Your Email"
           pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
           title="Please enter a valid email, for example: name@gmail.com" required>
</div>


<div class="input-box">
    <i class="fa-solid fa-message"></i>
    <textarea placeholder="Your Message" minlength="5" required></textarea>
</div>

    <button type="submit">Send Message</button>

</form>

    </main>

    <footer class="footer">
        <p>&copy; 2026 VELORA | Bags & Shoes</p>
    </footer>

</body>

</html>
